packages:
  - apps/console/*
  - apps/idp/*
  - examples/reference-app

catalogMode: strict

catalog:
  '@better-auth/core': 1.7.26
  '@formisch/vue': ^1.2.0
  '@types/node': 26.6.6
  '@xcvzlabs/env': 0.1.2
  openid-client: 6.9.0
  consola: ^3.4.2
  genbumppush: 0.0.10
  typescript: 6.0.3
  uuid: ^14.0.3
  valibot: 1.5.0
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0

catalogs:
  api:
    '@better-auth/oauth-provider': 1.7.26
    '@types/nodemailer': 8.0.2
    better-auth: 1.7.26
    nodemailer: 10.6.0
    drizzle-kit: 1.0.0-rc.5-5935859
    drizzle-orm: 1.0.0-rc.5-5935859
    drizzle-query-logger: 1.1.3
    nitro: 3.0.261103-rc
    playwright: 1.65.1
    postgres: 4.1.1
    rolldown: 1.2.19
  web:
    '@golar/vue': 0.1.11
    '@iconify-json/lucide': 1.2.156
    '@nuxt/ui': ^4.12.2
    golar: 0.1.11
    nuxt: 4.6.4
    tailwindcss: ^4.3.5
    vue: 3.5.45
    vue-router: 5.4.0
    vue-tsc: 3.3.14

overrides:
  'esbuild@>=0.27.3 <0.28.1': 0.28.2
  vite@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

allowBuilds:
  esbuild: true
  vue-demi: true

minimumReleaseAgeExclude:
  - '@better-auth/oauth-provider@1.7.26'
  - '@better-auth/core@1.7.26'
  - '@better-auth/drizzle-adapter@1.7.26'
  - '@better-auth/kysely-adapter@1.7.26'
  - '@better-auth/memory-adapter@1.7.26'
  - '@better-auth/mongo-adapter@1.7.26'
  - '@better-auth/prisma-adapter@1.7.26'
  - '@better-auth/telemetry@1.7.26'
  - 'better-auth@1.7.26'
  - 'better-call@1.4.6'
