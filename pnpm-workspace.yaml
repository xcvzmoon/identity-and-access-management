packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: strict

catalog:
  '@types/node': 26.6.6
  genbumppush: 0.0.10
  typescript: 6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0

catalogs:
  api:
    nitro: 3.0.261103-rc
    rolldown: 1.2.19
  web:
    nuxt: npm:nuxt-nightly@5.0.0-2611150147-d897f4c
    vue: 3.5.45
    vue-router: 5.5.1
    vue-tsc: 3.3.14

overrides:
  vite@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

allowBuilds:
  esbuild: true
