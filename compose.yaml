services:
  api:
    build:
      context: .
      target: api
    env_file:
      - path: ./packages/auth/.env
        required: false
      - path: ./packages/database/.env
        required: false
    environment:
      APP_ENV: production
      DB_HOST: ${DOCKER_DB_HOST:-host.docker.internal}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:5173:3000'
    init: true
